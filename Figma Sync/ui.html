<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: Inter, sans-serif; padding: 12px; background: #1e1e1e; color: #fff; margin: 0; }
    textarea { width: 100%; height: 210px; background: #2c2c2c; color: #fff; border: 1px solid #444; border-radius: 4px; font-family: monospace; font-size: 11px; box-sizing: border-box; padding: 8px; margin-bottom: 8px; }
    button { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; background: #0d99ff; color: #fff; }
  </style>
</head>
<body>
  <textarea id="payload" placeholder="Pega el JSON codificado de VANTAGE aquí..."></textarea>
  <button onclick="sync()">Inyectar a Nodos Nativos</button>

  <script>
    function sync() {
      const rawText = document.getElementById('payload').value;
      try {
        const parsed = JSON.parse(rawText);
        parent.postMessage({ pluginMessage: { type: 'execute-sync', data: parsed } }, '*');
      } catch(e) {
        alert('JSON inválido.');
      }
    }
  </script>
</body>
</html>
