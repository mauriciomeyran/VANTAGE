<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; margin: 12px; }
    textarea { width: 100%; height: 280px; font-family: monospace; font-size: 11px; box-sizing: border-box; }
    button { margin-top: 8px; width: 100%; height: 32px; background: #0175FF; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <textarea id="markdownInput" placeholder="Pega aquí el Markdown con figma_text_id..."></textarea>
  <button id="syncBtn">Sincronizar Lienzo</button>

  <script>
    function parseMarkdownToPayload(mdText) {
      const payload = {};
      
      // Regex para capturar bloques: ###### [figma_text_id](ID) o ###### figma_text_id(ID)
      const blockRegex = /######\s*(?:\[figma_text_id\]|\bfigma_text_id\b)\(?([^\)\n]+)\)?\s*\n([\s\S]*?)(?=(?:######\s*(?:\[figma_text_id\]|\bfigma_text_id\b)|$))/g;
      
      let match;
      while ((match = blockRegex.exec(mdText)) !== null) {
        const rawId = match[1].trim();
        let body = match[2].trim();
        
        const boldRanges = [];
        let cleanText = "";
        let currentIndex = 0;
        
        // Regex para emparejar **bold**
        const boldRegex = /\*\*(.*?)\*\*/g;
        let lastIdx = 0;
        let bMatch;
        
        while ((bMatch = boldRegex.exec(body)) !== null) {
          // Texto previo al bold
          const prevText = body.substring(lastIdx, bMatch.index);
          cleanText += prevText;
          currentIndex += prevText.length;
          
          const boldText = bMatch[1];
          const start = currentIndex;
          cleanText += boldText;
          currentIndex += boldText.length;
          const end = currentIndex;
          
          boldRanges.push({ start, end });
          lastIdx = boldRegex.lastIndex;
        }
        
        // Texto sobrante tras el último bold
        cleanText += body.substring(lastIdx);
        
        if (rawId) {
          payload[rawId] = {
            text: cleanText,
            boldRanges: boldRanges
          };
        }
      }
      return payload;
    }

    document.getElementById('syncBtn').onclick = () => {
      const rawText = document.getElementById('markdownInput').value;
      if (!rawText.trim()) return;

      let payload = {};
      // Fallback: Si el usuario pega JSON directo, lo parsea; si no, ejecuta el parser Markdown
      if (rawText.trim().startsWith('{')) {
        try {
          payload = JSON.parse(rawText);
        } catch (e) {
          alert('Error al parsear el JSON proporcionado.');
          return;
        }
      } else {
        payload = parseMarkdownToPayload(rawText);
      }

      parent.postMessage({ pluginMessage: { type: 'sync-nodes', payload } }, '*');
    };
  </script>
</body>
</html>
